name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python skills/ai-native-control-plane/scripts/validate_artifacts.py --all
      - run: python -m unittest discover -s tests -p 'test_*.py'
